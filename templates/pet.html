<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset="utf-8">
        <meta name = "viewport" content="width=device-width, initial-scale=1">
        <title>Hangry Pets</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>
    <body>
        <div class="container mt-4">
            <div class="card">
               <div class="card-body">
                  <h1>{{ emoji }} {{ name }}</h1>
                  <p>{{ species }} · Level {{ level }}</p>
                  <div>Hunger :{{hunger}}/100</div>
                  <div class="progress mb-3">
                    <div class="progress-bar bg-danger" style="width: {{hunger}}%"></div>
                  </div>
                  <div>Happiness :{{happiness}}/100</div>
                  <div class="progress mb-3">
                    <div class="progress-bar bg-info" style="width: {{happiness}}%"></div>
                  </div>
                  <div>Energy :{{energy}}/100</div>
                  <div class="progress mb-3">
                    <div class="progress-bar bg-warning" style="width: {{energy}}%"></div>
                  </div>
               <div class="d-flex gap-2">
                <from method="post" action="/feed">
                    <button class="btn btn-success">Feed</button>
                </from>
                <form method="post" action="/play">
                    <button class="btn btn-success">Play</button>
                </form>
                <form method="post" action="/sleep">
                    <button class="btn btn-primary">Sleep</button>
                </form>
               </div>
            </div>
            </div>
        </div>
    </body>
   

</html>
