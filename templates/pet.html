<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset="utf-8">
        <meta name = "viewport" content="width=device-width, initial-scale=1">
        <title>Hangry Pets</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>
    <body>
        <div class="container mt-4">
            <div class="card">
               <div class="card-body">
                  <h1> 🐉 Blaze </h1>
                  <p> Dragon . Level 2</p>
                  <div>Hunger :{{hunger}}/100</div>
                  <div class="progress mb-3">
                    <div class="progress-bar bg-danger" style="width: {{hunger}}%"></div>
                  </div>
                  <div>Happiness :{{happiness}}/100</div>
                  <div class="progress mb-3">
                    <div class="progress-bar bg-info" style="width: {{happiness}}%"></div>
                  </div>
                  <div>Energy :{{energy}}/100</div>
                  <div class="progress mb-3">
                    <div class="progress-bar bg-warning" style="width: {{energy}}%"></div>
                  </div>
               </div>
            </div>
        </div>
    </body>
   

</html>
