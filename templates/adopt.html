<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Hangry Pets</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>
    <body>
        <div class="container mt-4">
        <h1>Adopt your pet</h1>

        <form method="post" action="/adopt">
        <div class="row row-cols-5 g-3 mt-2">
            {% for pet in species %}
                <div class="col">
                    <label class="card text-center h-100">
                        <div class="card-body">
                            <div class="display-4">{{ pet.emoji }}</div>
                            <h5>{{ pet.name }}</h5>
                             <p class="text-secondary">{{ pet.trait }}</p>
                             <input class="form-check-input" type="radio" name="species" value="{{ pet.name }}" required>
                        </div>
                    </label>
                </div>
            {% endfor %}
        </div>

        <div class="d-flex gap-2 mt-4">
            <input class="form-control" name="pet_name" placeholder="Name your pet" required>
            <button class="btn btn-danger">Adopt</button>
        </div>
        </form>  
    </div>
  </body>
</html>
