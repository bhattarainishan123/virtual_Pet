<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Hangry Pets</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Baloo+2:wght@400;600&display=swap">
        <style>
            :root {
                --bs-body-font-family: 'Baloo 2', sans-serif;
            }
            .logo-font {
                font-family: 'Cherry Bomb One', cursive;
                font-size: 1.8rem;
            }

            .pet-name span {
                display: inline-block;
                font-family: 'Cherry Bomb One', cursive;
                color: #FFD43B;
                -webkit-text-stroke: 2px #212529;
                paint-order: stroke fill;
                animation: wave 1.4s ease-in-out infinite;
            }

            @keyframes wave {
                0%, 60%, 100% { transform: translateY(0); }
                30% { transform: translateY(-12px)}
            }

            @media (prefers-reduced-motion: reduce) {
                .pet-name span { animation: none; }
            }
        </style>
    </head>
    <body>
        <nav class="navbar bg-body-tertiary border-bottom">
            <div class="container">
                <a class="navbar-brand text-danger logo-font" href="{{ url_for('pet')}}">Hangry Pets</a>
                <div class="d-flex gap-3">
                    <a class="nav-link" href="{{ url_for('pet') }}">My Pet</a>
                    <a class="nav-link" href="{{ url_for('adopt') }}">Adopt</a>
                </div>
            </div>
        </nav>
        <div class="container mt-4">
            {% block content %}{% endblock %}
        </div>
    </body>
</html>
